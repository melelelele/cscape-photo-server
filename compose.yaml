services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - backend

    security_opt:
      - no-new-privileges:true


  app:
    build: .
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - frontend
      - backend

    security_opt:
      - no-new-privileges:true


  # Wird im internen Uni-Betrieb nicht gestartet.
  # Später kann Caddy für einen öffentlichen Domainbetrieb verwendet werden.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped

    profiles:
      - public

    environment:
      DOMAIN: ${DOMAIN:-localhost}

    depends_on:
      app:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - frontend

    security_opt:
      - no-new-privileges:true


volumes:
  postgres_data:
  caddy_data:
  caddy_config:


networks:
  frontend:

  backend:
    internal: true
